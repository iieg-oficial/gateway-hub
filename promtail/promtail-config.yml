server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: ${LOKI_URL:-http://loki:3100}/loki/api/v1/push

scrape_configs:
  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          service: gateway-hub
          environment: production
          __path__: /var/log/nginx/access.log

    pipeline_stages:
      - json:
          expressions:
            request_uri: request_uri
            status: status
            request_method: request_method
            request_time: request_time
            upstream_response_time: upstream_response_time
            upstream_addr: upstream_addr

      - regex:
          source: request_uri
          expression: '^/(?P<subroute>[^/?]+)'

      - labels:
          subroute:
          status:
          request_method:

  - job_name: nginx-errors
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          service: gateway-hub
          environment: production
          level: error
          __path__: /var/log/nginx/error.log
