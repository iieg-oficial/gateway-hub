name: gateway-hub

x-logging: &logging
  driver: json-file
  options:
    max-size: "30m"
    max-file: "3"

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3

x-host-gateway: &host-gateway
  - 'host.docker.internal:host-gateway'

services:
  nginx:
    build:
      context: .
    env_file:
      - .env
    ports:
      - '${GATEWAY_BIND_ADDR:?}:80:80'
      - '${GATEWAY_BIND_ADDR:?}:443:443'
    volumes:
      - ${SSL_HOST_PATH:?}:/etc/nginx/certs:ro
      - ${SIEEJ_DIST_PATH:?}:/usr/share/nginx/html/sieej:ro
      - ${NGINX_CACHE_PATH:?}:/var/cache/nginx-data
      - ./mantenimiento:/etc/nginx/mantenimiento:ro
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?}
      SSL_CERTIFICATE: ${SSL_CERTIFICATE:?}
      SSL_CERTIFICATE_KEY: ${SSL_CERTIFICATE_KEY:?}
      SSL_TRUSTED_CERTIFICATE: ${SSL_TRUSTED_CERTIFICATE?}
      PORTAL_HOST: ${PORTAL_HOST:?}
      SITIO_HOST: ${SITIO_HOST:?}
      MAPALAB_HOST: ${MAPALAB_HOST:?}
      ACERVO_HOST: ${ACERVO_HOST:?}
      MARIACHI_HOST: ${MARIACHI_HOST:?}
      SEXTANTE_HOST: ${SEXTANTE_HOST:?}
      GTM_ID: ${GTM_ID?}
      CSP_EXTRA_ORIGINS: ${CSP_EXTRA_ORIGINS?}
      SEO_ENABLED: ${SEO_ENABLED:?}
      CONN_LIMIT: ${CONN_LIMIT:?}
      REAL_IP_FROM: ${REAL_IP_FROM?}
      ADMIN_ALLOW_CIDRS: ${ADMIN_ALLOW_CIDRS?}
      MONITOR_ALLOW_CIDRS: ${MONITOR_ALLOW_CIDRS?}
      INTERNAL_UPLOAD_ALLOW_CIDRS: ${INTERNAL_UPLOAD_ALLOW_CIDRS?}
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fsk https://localhost/robots.txt || exit 1"]
      start_period: 10s
    extra_hosts: *host-gateway
    networks:
      - iieg-network
    restart: unless-stopped
    logging: *logging

  docker-socket-proxy:
    image: nginx:1.30.4-alpine
    container_name: gateway-docker-socket-proxy
    restart: unless-stopped
    user: "101:101"
    group_add:
      - ${DOCKER_GID:?}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./version-api/docker-proxy.conf:/etc/nginx/nginx.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    logging: *logging

  version-api:
    build: ./version-api
    container_name: gateway-version-api
    restart: unless-stopped
    environment:
      ONTOY_SERVICE: gateway-hub
      ONTOY_NODE: ${ONTOY_NODE:?}
      ONTOY_NODE_REPORTER: ${ONTOY_NODE_REPORTER:?}
      ONTOY_PEER_CHECKS: ${ONTOY_PEER_CHECKS}
      ONTOY_COMPOSE_PROJECT: gateway-hub
      ONTOY_DISK_PATH: ${ONTOY_DISK_PATH:?}
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      ONTOY_PORT_CHECKS: "portal=${PORTAL_HOST:?},sitio=${SITIO_HOST:?},mapalab=${MAPALAB_HOST:?},acervo=${ACERVO_HOST:?},sextante=${SEXTANTE_HOST:?},mariachi=${MARIACHI_HOST:?}"
      ONTOY_DEPENDENCIES: "plugin_qgis=${PLUGIN_QGIS_URL:?}"
    volumes:
      - ./VERSION:/app/VERSION:ro
      - /etc/os-release:/host/etc/os-release:ro
    depends_on:
      - docker-socket-proxy
    extra_hosts: *host-gateway
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8088), timeout=3).close()"]
    networks:
      - iieg-network
      - docker-api
    logging: *logging

networks:
  iieg-network:
    external: true
  docker-api:
    name: gateway-hub-docker-api
    internal: true
