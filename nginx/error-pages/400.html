<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud no válida</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #FFFFFF 0%, #F7F0FA 100%);
            color: #2E4372;
            padding: 1.5rem;
            text-align: center;
        }

        .container {
            max-width: 520px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .illustration {
            width: 200px;
            height: 200px;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: clamp(1.5rem, 4vw, 2.25rem);
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 1rem;
            color: #2E4372;
        }

        p {
            font-size: 1rem;
            line-height: 1.6;
            color: #5a6a8a;
            margin-bottom: 2rem;
            max-width: 440px;
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 2.5rem;
            border-radius: 30px;
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            background: #703089;
            color: #fff;
        }

        .btn:hover {
            background: #5C2472;
            box-shadow: 0 6px 6px rgba(92, 36, 114, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <svg class="illustration" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="100" cy="100" r="90" fill="#F0E6F6" />
            <rect x="60" y="55" width="80" height="90" rx="8" fill="#E8D5F0" />
            <rect x="60" y="55" width="80" height="90" rx="8" stroke="#703089" stroke-width="3" fill="none" />
            <line x1="75" y1="80" x2="125" y2="80" stroke="#703089" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />
            <line x1="75" y1="92" x2="115" y2="92" stroke="#703089" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />
            <line x1="75" y1="104" x2="120" y2="104" stroke="#703089" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />
            <circle cx="135" cy="130" r="20" fill="#F0E6F6" stroke="#703089" stroke-width="3" />
            <text x="135" y="137" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#703089">!</text>
            <circle cx="155" cy="50" r="8" fill="#E8D5F0" />
            <circle cx="45" cy="140" r="6" fill="#E8D5F0" />
        </svg>
        <h1>No pudimos procesar<br>tu solicitud</h1>
        <p>La solicitud enviada no es válida. Verifica la información e intenta de nuevo.</p>
        <a href="/" class="btn">Regresar al inicio</a>
    </div>
</body>
</html>
