<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demasiadas solicitudes</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #FFFFFF 0%, #F7F0FA 100%);
            color: #2E4372;
            padding: 1.5rem;
            text-align: center;
        }

        .container {
            max-width: 520px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .illustration {
            width: 200px;
            height: 200px;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: clamp(1.5rem, 4vw, 2.25rem);
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 1rem;
            color: #2E4372;
        }

        p {
            font-size: 1rem;
            line-height: 1.6;
            color: #5a6a8a;
            margin-bottom: 2rem;
            max-width: 440px;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            width: 100%;
            align-items: center;
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 2.5rem;
            border-radius: 30px;
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-primary {
            background: #703089;
            color: #fff;
        }

        .btn-primary:hover {
            background: #5C2472;
            box-shadow: 0 6px 6px rgba(92, 36, 114, 0.2);
        }

        .btn-secondary {
            background: transparent;
            color: #703089;
            border: 1.5px solid #703089;
        }

        .btn-secondary:hover {
            background: #703089;
            color: #fff;
        }

        .countdown {
            font-size: 0.875rem;
            color: #5a6a8a;
            margin-top: 1rem;
        }

        @media (min-width: 480px) {
            .actions {
                flex-direction: row;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <svg class="illustration" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="100" cy="100" r="90" fill="#F0E6F6" />
            <rect x="55" y="60" width="90" height="70" rx="8" fill="#E8D5F0" stroke="#703089" stroke-width="3" />
            <rect x="65" y="72" width="12" height="35" rx="2" fill="#703089" opacity="0.9">
                <animate attributeName="height" values="35;20;35" dur="1.2s" repeatCount="indefinite" />
                <animate attributeName="y" values="72;87;72" dur="1.2s" repeatCount="indefinite" />
            </rect>
            <rect x="82" y="72" width="12" height="35" rx="2" fill="#703089" opacity="0.7">
                <animate attributeName="height" values="25;35;25" dur="1.2s" begin="0.2s" repeatCount="indefinite" />
                <animate attributeName="y" values="82;72;82" dur="1.2s" begin="0.2s" repeatCount="indefinite" />
            </rect>
            <rect x="99" y="72" width="12" height="35" rx="2" fill="#703089" opacity="0.8">
                <animate attributeName="height" values="35;15;35" dur="1.2s" begin="0.4s" repeatCount="indefinite" />
                <animate attributeName="y" values="72;92;72" dur="1.2s" begin="0.4s" repeatCount="indefinite" />
            </rect>
            <rect x="116" y="72" width="12" height="35" rx="2" fill="#703089" opacity="0.6">
                <animate attributeName="height" values="20;35;20" dur="1.2s" begin="0.6s" repeatCount="indefinite" />
                <animate attributeName="y" values="87;72;87" dur="1.2s" begin="0.6s" repeatCount="indefinite" />
            </rect>
            <circle cx="155" cy="50" r="8" fill="#E8D5F0" />
            <circle cx="45" cy="140" r="6" fill="#E8D5F0" />
            <circle cx="160" cy="150" r="10" fill="#F0E6F6" />
        </svg>
        <h1>Espera un momento</h1>
        <p>Estás realizando demasiadas solicitudes. Espera unos segundos antes de continuar navegando.</p>
        <div class="actions">
            <button class="btn btn-primary" id="retryBtn" disabled onclick="window.location.reload()">Reintentar (<span id="timer">10</span>s)</button>
            <a href="/" class="btn btn-secondary">Ir al inicio</a>
        </div>
    </div>
    <script>
        var seconds = 10;
        var timer = document.getElementById('timer');
        var btn = document.getElementById('retryBtn');
        var interval = setInterval(function() {
            seconds--;
            timer.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(interval);
                btn.disabled = false;
                btn.textContent = 'Reintentar';
            }
        }, 1000);
    </script>
</body>
</html>
