<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso no autorizado</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #FFFFFF 0%, #F7F0FA 100%);
            color: #2E4372;
            padding: 1.5rem;
            text-align: center;
        }

        .container {
            max-width: 520px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .illustration {
            width: 200px;
            height: 200px;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: clamp(1.5rem, 4vw, 2.25rem);
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 1rem;
            color: #2E4372;
        }

        p {
            font-size: 1rem;
            line-height: 1.6;
            color: #5a6a8a;
            margin-bottom: 2rem;
            max-width: 440px;
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 2.5rem;
            border-radius: 30px;
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            background: #703089;
            color: #fff;
        }

        .btn:hover {
            background: #5C2472;
            box-shadow: 0 6px 6px rgba(92, 36, 114, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <svg class="illustration" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="100" cy="100" r="90" fill="#F0E6F6" />
            <rect x="75" y="85" width="50" height="45" rx="5" fill="#E8D5F0" stroke="#703089" stroke-width="3" />
            <path d="M85 85 V72 C85 62 92 55 100 55 C108 55 115 62 115 72 V85" stroke="#703089" stroke-width="4" stroke-linecap="round" fill="none" />
            <circle cx="100" cy="105" r="5" fill="#703089" />
            <rect x="98" y="108" width="4" height="10" rx="2" fill="#703089" />
            <circle cx="155" cy="50" r="8" fill="#E8D5F0" />
            <circle cx="45" cy="140" r="6" fill="#E8D5F0" />
            <circle cx="50" cy="55" r="10" fill="#F0E6F6" />
            <circle cx="160" cy="150" r="10" fill="#F0E6F6" />
        </svg>
        <h1>Acceso no autorizado</h1>
        <p>Necesitas iniciar sesión para acceder a este recurso. Si crees que es un error, contacta al administrador.</p>
        <a href="/" class="btn">Regresar al inicio</a>
    </div>
</body>
</html>
