:root {
    --fondo-alto: #FFFFFF;
    --fondo-bajo: #F7F0FA;
    --tinta: #2E4372;
    --tinta-suave: #5A6A8A;
    --morado: #703089;
    --morado-oscuro: #5C2472;
    --lila: #F0E6F6;
    --lila-medio: #E8D5F0;
    --naranja: #FF8300;
    --fuente: 'Garet', system-ui, -apple-system, sans-serif;
    color-scheme: light;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
    font-family: var(--fuente);
    background: linear-gradient(180deg, var(--fondo-alto) 0%, var(--fondo-bajo) 100%);
    color: var(--tinta);
    display: flex;
    align-items: center;
    justify-content: center;
    padding-inline: 16px;
    padding-block: 32px;
    text-align: center;
}
.contenedor { width: 100%; max-width: 540px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
.marca { display: flex; align-items: center; justify-content: center; gap: 10px; max-width: 100%; }
.logo { width: min(250px, 62vw); height: auto; }
.ilustracion { width: 168px; height: 168px; max-width: 100%; }
.etiqueta {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--morado); background: var(--lila); border-radius: 999px; padding: 6px 14px;
}
.etiqueta i { width: 8px; height: 8px; border-radius: 50%; background: var(--naranja); animation: latido 1.6s ease-in-out infinite; }
h1 { font-size: clamp(1.6rem, 4.4vw, 2.3rem); font-weight: 800; line-height: 1.2; text-wrap: balance; }
.bloque-novedades { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.rotulo { font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--naranja); }
.novedades { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.pildora {
    font-family: inherit; font-size: 13px; font-weight: 600; color: var(--morado-oscuro); cursor: pointer;
    background: #FFFFFF; border: 1px solid var(--lila-medio); border-radius: 999px; padding: 5px 12px;
    transition: border-color 0.15s ease, background 0.15s ease;
}
.pildora:hover { border-color: var(--morado); }
.pildora[aria-expanded="true"] { border-color: var(--morado); background: var(--lila); }
.pildora:focus-visible { outline: 2px solid var(--naranja); outline-offset: 2px; }
.detalle { font-size: 14px; line-height: 1.5; color: var(--tinta); max-width: 42ch; min-height: 21px; }
.boton {
    font-family: inherit; font-size: 0.875rem; font-weight: 700; color: #FFFFFF; background: var(--morado);
    border: none; border-radius: 30px; padding: 0.8rem 2.5rem; cursor: pointer; transition: background 0.2s ease, box-shadow 0.2s ease;
}
.acciones { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.boton { text-decoration: none; display: inline-block; }
.boton-contorno { background: transparent; color: var(--morado); box-shadow: inset 0 0 0 1.5px var(--morado); }
.boton-contorno:hover { background: var(--morado); color: #FFFFFF; }
.boton:hover { background: var(--morado-oscuro); box-shadow: 0 6px 6px rgba(92, 36, 114, 0.2); }
.boton:focus-visible { outline: 3px solid var(--naranja); outline-offset: 3px; }
.cuenta { font-family: inherit; font-size: 13px; color: var(--tinta-suave); font-variant-numeric: tabular-nums; background: none; border: none; cursor: pointer; padding: 4px 8px; border-radius: 999px; }
.cuenta:hover { color: var(--morado); text-decoration: underline; text-underline-offset: 3px; }
.cuenta:focus-visible { outline: 2px solid var(--naranja); outline-offset: 2px; }
@media (max-width: 600px) {
    .contenedor { gap: 16px; }
    .ilustracion { width: 104px; height: 104px; }
    .etiqueta, #reintentar { display: none; }
    .cuenta { color: var(--morado); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
}
.pie { font-size: 12px; color: var(--tinta-suave); opacity: 0.8; }
@keyframes giro { to { transform: rotate(360deg); } }
.engrane { transform-origin: 138px 58px; animation: giro 6s linear infinite; }
@keyframes latido { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .etiqueta i, .engrane { animation: none; } }
</style>

    <span class="etiqueta"><i></i>Actualización en curso</span>
    <div class="bloque-novedades">
    <span class="rotulo">Lo nuevo</span>
    <div class="novedades" aria-label="Lo nuevo en MapaLab">
        <button type="button" class="pildora" data-texto="Aísla una capa con un clic, y el mapa la sigue cuando eliges otra." aria-expanded="false" aria-controls="detalle">Solo seleccionada</button><button type="button" class="pildora" data-texto="Al pasar el mouse por Capas activas, las demás se atenúan para que esa destaque." aria-expanded="false" aria-controls="detalle">Resaltar capa</button><button type="button" class="pildora" data-texto="Elige año y mes desde la propia capa, sin abrir su ficha." aria-expanded="false" aria-controls="detalle">Fechas a la mano</button><button type="button" class="pildora" data-texto="Las líneas se miden sobre el relieve, con subida, bajada y perfil de elevación." aria-expanded="false" aria-controls="detalle">Perfil del terreno</button><button type="button" class="pildora" data-texto="Baja solo lo que cae dentro de tu polígono, con conteos y densidad por capa." aria-expanded="false" aria-controls="detalle">Descargar selección</button><button type="button" class="pildora" data-texto="Reporta un error o propone una mejora desde el mapa, también en el mapa incrustado." aria-expanded="false" aria-controls="detalle">Colibrí</button>
    </div>
    <p class="detalle" id="detalle" aria-live="polite" hidden></p>
    </div>
    <div class="acciones">
        <button class="boton" type="button" id="reintentar">Volver a intentar</button>
        <a class="boton boton-contorno" href="/">Ir al sitio del IIEG</a>
    </div>
    <button type="button" class="cuenta" id="cuenta" aria-live="polite">Volvemos a intentar en 60 s</button>
    <span class="pie">Instituto de Información Estadística y Geográfica de Jalisco</span>
</main>

<script>
(() => {
    const ESPERA = 60;
    let resta = ESPERA;
    const cuenta = document.getElementById('cuenta');
    const recargar = () => window.location.reload();
    const pintar = () => { cuenta.textContent = 'Volvemos a intentar en ' + resta + ' s'; };
    document.getElementById('reintentar').addEventListener('click', recargar);
    cuenta.addEventListener('click', recargar);
    cuenta.title = 'Toca para intentar ahora';
    setInterval(() => {
        resta -= 1;
        if (resta <= 0) recargar();
        else pintar();
    }, 1000);
    pintar();

    const detalle = document.getElementById('detalle');
    const pildoras = [...document.querySelectorAll('.pildora')];
    pildoras.forEach((pildora) => pildora.addEventListener('click', () => {
        const abrir = pildora.getAttribute('aria-expanded') !== 'true';
        pildoras.forEach(otra => otra.setAttribute('aria-expanded', 'false'));
        pildora.setAttribute('aria-expanded', String(abrir));
        detalle.textContent = abrir ? pildora.dataset.texto : '';
        detalle.hidden = !abrir;
    }));
})();
</script>
