worker_processes auto;
worker_rlimit_nofile 16384;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time urt=$upstream_response_time';

    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    keepalive_timeout 65;

    open_file_cache          max=1000 inactive=20s;
    open_file_cache_valid    30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml text/xml;

    proxy_buffering        on;
    proxy_buffer_size      32k;
    proxy_buffers          16 32k;
    proxy_busy_buffers_size 64k;

    proxy_cache_path /var/cache/nginx/geoserver
        levels=1:2
        keys_zone=geoserver_cache:20m
        max_size=2g
        inactive=12h
        use_temp_path=off;

    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    map $http_user_agent $is_blocked_agent {
        default 0;
        ~*curl 1;
        ~*wget 1;
        ~*python 1;
        ~*scrapy 1;
        ~*httpclient 1;
        ~*bot 1;
        ~*spider 1;
        ~*java 1;
        ~*perl 1;
        ~*ruby 1;
        ~*php 1;
        ~*go-http 1;
        ~*node-fetch 1;
        ~*axios 1;
        ~*postman 1;
        ~*insomnia 1;
        ~*httpie 1;
        ~*headless 1;
        ~*phantom 1;
        ~*selenium 1;
        ~*puppeteer 1;
        ~*playwright 1;
        ~*ChatGPT 1;
        ~*GPTBot 1;
        ~*Google-Extended 1;
        ~*CCBot 1;
        ~*anthropic 1;
        ~*ClaudeBot 1;
        ~*Bytespider 1;
        ~*PetalBot 1;
        ~*Amazonbot 1;
        ~*FacebookBot 1;
        ~*SemrushBot 1;
        ~*AhrefsBot 1;
        ~*MJ12bot 1;
        ~*DotBot 1;
        ~*Applebot 1;
        ~*YandexBot 1;
        ~*BingBot 1;
        "" 1;
    }

    include /etc/nginx/conf.d/*.conf;
}
