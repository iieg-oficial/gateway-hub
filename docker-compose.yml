name: gateway-hub

services:
  nginx:
    build:
      context: .
    env_file:
      - .env
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ${SSL_VOLUME_PATH}
      - ${SIEEJ_DIST_PATH}:/usr/share/nginx/html/sieej:ro
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      SSL_CERTIFICATE: ${SSL_CERTIFICATE}
      SSL_CERTIFICATE_KEY: ${SSL_CERTIFICATE_KEY}
      PORTAL_HOST: ${PORTAL_HOST}
      MAPALAB_HOST: ${MAPALAB_HOST}
      ACERVO_HOST: ${ACERVO_HOST}
      MARIACHI_HOST: ${MARIACHI_HOST}
      GEOSERVER_HOST: ${GEOSERVER_HOST}
      HUACHICOL_HOST: ${HUACHICOL_HOST}
      GTM_ID: ${GTM_ID}
      SEO_ENABLED: ${SEO_ENABLED}
      REAL_IP_FROM: ${REAL_IP_FROM}

    healthcheck:
      test: ["CMD-SHELL", "curl -fsk https://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - iieg-network
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter
    command:
      - '--nginx.scrape-uri=http://nginx:8080/stub_status'
    networks:
      - iieg-network
    depends_on:
      - nginx
    restart: unless-stopped

networks:
  iieg-network:
    external: true
